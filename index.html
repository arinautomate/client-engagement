async function call(action, args) {

  const form = new URLSearchParams();
  form.set('action', action); form.set('slug', SLUG); form.set('token', token()); form.set('args', JSON.stringify(args || {}));
  const r = await fetch(API, { method: 'POST', body: form });
  let body = {}; try { body = await r.json(); } catch (e) {}
  if (r.status === 401 && action !== 'verify_code') { setToken(''); D = null; render(); }
  return { status: r.status, body };
}
async function act(action, args, okText) {
  const r = await call(action, args);
  if (r.body && r.body.ok) { if (okText) toast(okText); await load(); return r.body; }
  const e = (r.body && r.body.error) || ('error ' + r.status);

  return null;
}

    <textarea class="fi" id="ev-text-${esc(sys)}" placeholder="paste the transcript or describe the task step by step" style="margin-top:6px"></textarea><button class="btn small" style="margin-top:6px" data-act="ev-add" data-sys="${esc(sys)}">add evidence</button>` : ''}</div>
  ${(isAdmin() || draft) && !removed ? `<div class="sub ${isAdmin() ? 'arin-only' : ''}"><h4>ai mapping helper${isAdmin() ? '<span class="arin-tag">run by ar|in</span>' : ''}</h4>
    ${isAdmin() ? `<button class="btn small arin" data-act="helper" data-sys="${esc(sys)}">draft from evidence</button> <span class="muted">the draft is a suggestion. it never changes the document until someone accepts each field.</span>` : ''}
    ${draft && draft.output ? `<div style="margin-top:8px">${(draft.output.steps || []).map(st => `<div class="step"><b>${esc(st.step_id)}</b>${FIELDS.map(([f, l]) => { const v = st.fields && st.fields[f]; if (!v) return ''; const c = (v.citations || [])[0];
        return `<div style="font-size:12px;margin-top:3px"><span class="fl">${l}</span> ${v.value === 'unknown' ? '<span class="gap">unknown, question sent</span>' : esc(Array.isArray(v.value) ? v.value.join(' / ') : v.value)}${c ? `<div class="muted">cited: “${esc(c.excerpt)}”</div>` : ''}</div>`; }).join('')}</div>`).join('')}
      ${(draft.validation && (draft.validation.rejected_citations || []).length) ? `<p class="gap">${draft.validation.rejected_citations.length} suggestion rejected: its citation is not in the evidence (${esc(draft.validation.rejected_citations.map(x => x.step_id + ' ' + x.field).join(', '))}). set to unknown.</p>` : ''}
      ${editable ? `<button class="btn small arin" data-act="use-draft" data-sys="${esc(sys)}">copy the draft into the document (unaccepted)</button>` : ''}</div>` : ''}</div>` : ''}
  ${(det.open_questions || []).length ? `<div class="sub"><h4>open questions for the person who knows this best</h4>${det.open_questions.map(q => `<div class="q"><div>${esc(q.text)} ${q.blocking ? '<span class="muted">(needed before sign-off)</span>' : ''}</div>
    ${can('question_answer') ? `<div class="row" style="margin-top:6px"><input class="fi" id="qa-${q.question_id}" placeholder="your answer"><button class="btn small" data-act="answer" data-q="${q.question_id}">answer</button>${can('questions_manage') ? `<button class="btn small arin" data-act="dismiss" data-q="${q.question_id}">dismiss</button>` : ''}</div>` : ''}</div>`).join('')}</div>` : ''}
  <div class="sub"><h4>system document · phase 1 (how it runs today)</h4>${s && s.locked ? '<p class="muted">locked while an approval is open.</p>' : ''}
    ${stepsEditor(sys, doc, editable)}
    ${editable ? `<div class="row"><button class="btn small arin" data-act="add-step" data-sys="${esc(sys)}">+ add step</button><button class="btn small" data-act="save-sys" data-sys="${esc(sys)}">save system document</button>${savedLine(s)}</div>` : savedLine(s)}
    <div style="margin-top:8px">${comp.complete ? '<span class="ok">complete: every step has its required fields accepted and no blocking question is open.</span>' : (comp.gaps ? '<span class="gap">still needed: ' + esc(comp.gaps.join(' · ')) + '</span>' : '')}</div></div>
  ${isAdmin() && m.status === 'Documented' ? `<div class="sub arin-only"><h4>teach-it test<span class="arin-tag">ar|in only</span></h4><div class="row"><input class="fi" style="max-width:260px" id="ti-by-${esc(sys)}" placeholder="who followed the document cold"><button class="btn small arin" data-act="teach" data-sys="${esc(sys)}" data-r="passed">passed</button><button class="btn small arin" data-act="teach" data-sys="${esc(sys)}" data-r="failed">failed</button></div></div>` : ''}
  ${isAdmin() && m.status === 'Reviewed' && !appr.some(a => a.status === 'open') ? `<div class="sub arin-only"><h4>phase 1 approval<span class="arin-tag">ar|in only</span></h4><button class="btn small arin" data-act="request-approval" data-sys="${esc(sys)}">request phase 1 approval (ar|in first, then the client)</button></div>` : ''}
  ${appr.length ? `<div class="sub"><h4>approvals</h4><table class="t"><tr><th>type</th><th>version</th><th>status</th><th>ar|in</th><th>client</th></tr>${appr.map(a => `<tr><td>${esc(a.type)}</td><td>${a.version_number}</td><td>${esc(a.status)}</td><td>${fmt(a.arin_at) || '-'}</td><td>${fmt(a.client_at) || '-'}</td></tr>`).join('')}</table></div>` : ''}
  </div></div>`;
}
function s4() {
  const d = deal();
  if (!d || !d.deposit_verified) return sectionShell('section-4', 4, 'system library', 'one document per system, phase 1 signed off before anything is built', 'locked', '', '<div class="lock-notice">opens when the first payment is verified.</div>', true);
  const systems = (D.authoritative.systems || []);
  const signed = systems.filter(x => x.status === 'Signed Off').length, live = systems.filter(x => x.status !== 'Removed').length;
  return sectionShell('section-4', 4, 'system library', 'one document per system, phase 1 signed off before anything is built', `${signed} of ${live} signed off`, d.library_completed_at ? 'so' : 'ip',
    `<div class="sec-body">${d.library_completed_at ? `<p class="ok" style="margin-bottom:12px">library complete ${fmt(d.library_completed_at)}. handed to build (OPS-002).</p>` : ''}${systems.map(systemCard).join('')}</div>`);
}
function approvalsSection() {
  const a = D.authoritative.approvals || [];
  return `<div class="section" id="section-approvals"><div class="sec-header"><div class="sec-left"><div><div class="sec-title">approvals</div><div class="sec-sub">binding approvals, each against one exact version</div></div></div></div><div class="sec-body">
    ${a.length ? `<table class="t"><tr><th>type</th><th>system</th><th>version</th><th>status</th><th>ar|in approved</th><th>client approved</th></tr>${a.map(x => `<tr><td>${esc(x.type)}</td><td>${esc(x.system_id)}</td><td>${x.version_number}</td><td>${esc(x.status)}</td><td>${fmt(x.arin_at) || '-'}</td><td>${fmt(x.client_at) || '-'}</td></tr>`).join('')}</table>` : '<p class="muted">no approvals yet.</p>'}</div></div>`;
}
function dots() {
  const set = (id, cls) => { const e = document.getElementById(id); if (e) e.className = 'sdot ' + (cls || ''); };
  if (!D) return;
  const c = D.authoritative.confirmations || {}, d = deal();
  set('dot1', c.s1_confirmed_at ? 'done' : 'active'); set('dot2', c.s2_confirmed_at ? 'done' : (c.s1_confirmed_at ? 'active' : ''));
  set('dot3', d && d.section3 && d.section3.reviewed_at ? 'done' : (d ? 'active' : ''));
  set('dotp', d && d.mapping_plan_agreed_at ? 'done' : (d && d.signed_at ? 'active' : ''));
  set('dot4', d && d.library_completed_at ? 'done' : (d && d.deposit_verified ? 'active' : ''));
}
function render() {
  const main = document.getElementById('main');
  document.getElementById('me').textContent = D ? `${D.me.name} (${D.me.role.replace('_', ' ')})` : 'not signed in';
  main.innerHTML = D ? header() + band() + s1() + s2() + s3() + planSection() + s4() + approvalsSection() : signinView();
  dots();
}

// ---------------- edits ----------------
function bindValue(path, value) {
  const [root, ...rest] = path.split('.');
  if (root === 's1' || root === 's2' || root === 's3') {
    const key = root, base = EDIT[key] || JSON.parse(JSON.stringify((sec(root.slice(1)) || {}).content || (root === 's2' ? { inventory: {} } : {})));
    if (root === 's2') { base.inventory = base.inventory || {}; base.owners = base.owners || {};
      if (rest[0] === 'owners') { const dk = rest[1], f = rest[2]; base.owners[dk] = base.owners[dk] || {}; base.owners[dk][f] = value; }
      else { const field = rest[rest.length - 1]; const name = rest.slice(1, -1).join('.'); base.inventory[name] = base.inventory[name] || {}; base.inventory[name][field] = value; } }
    else base[rest[0]] = value;
    EDIT[key] = base; return;
  }
  if (root === 'sys') {
    const sys = rest[0], i = +rest[1], f = rest[2], sub = rest[3];
    const key = 'sys:' + sys; const s = sec('4', sys);
    const doc = EDIT[key] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
    const st = doc.steps[i]; if (!st) return;
    st.fields = st.fields || {};
    if (f === 'decision_logic') st.decision_logic = value || null;
    else if (f === 'sends_message') st.sends_message = !!value;
    else { st.fields[f] = st.fields[f] || { value: '', accepted: false };
      if (sub === 'accepted') st.fields[f].accepted = !!value;
      else { const lines = String(value).split('\n').map(x => x.trim()).filter(Boolean); st.fields[f].value = (f === 'routing' && lines.length > 1) ? lines : String(value); } }
    EDIT[key] = doc;
  }
}
document.addEventListener('input', e => { const b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) bindValue(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); });
document.addEventListener('change', e => { const b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) bindValue(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); });
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
function s2buf() { if (!EDIT.s2) EDIT.s2 = JSON.parse(JSON.stringify((sec('2') || {}).content || {})); EDIT.s2.inventory = EDIT.s2.inventory || {}; EDIT.s2.owners = EDIT.s2.owners || {}; EDIT.s2.coverage = EDIT.s2.coverage || {}; return EDIT.s2; }
function invRemove(k) { const b = s2buf(); const f = b.inventory[k] && b.inventory[k].func; delete b.inventory[k]; invalidateReview(f); render(); }
function invSetStatus(k, v) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const now = (b.inventory[k].status === v ? '' : v); b.inventory[k].status = now; if (now) b.inventory[k].unresolved = false; render(); }
function invSetUnresolved(k) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const on = !b.inventory[k].unresolved; b.inventory[k].unresolved = on; if (on) b.inventory[k].status = ''; render(); }
function invSetNone(k, on) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; if (on) { b.inventory[k].software = ['no software / paper-based']; b.inventory[k].other = ''; } else { b.inventory[k].software = []; } render(); }
function invToggleSw(k, sw, on) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; let arr = (Array.isArray(b.inventory[k].software) ? b.inventory[k].software : []).filter(x => x !== 'no software / paper-based'); if (on) { if (!arr.includes(sw)) arr.push(sw); } else arr = arr.filter(x => x !== sw); b.inventory[k].software = arr; }
document.addEventListener('change', e => { const el = e.target, a = el.getAttribute && el.getAttribute('data-act'); if (a === 'inv-none') invSetNone(el.getAttribute('data-k'), el.checked); else if (a === 'inv-sw') invToggleSw(el.getAttribute('data-k'), el.getAttribute('data-sw'), el.checked); else if (a === 'func-review') setReviewed(el.getAttribute('data-k'), el.checked); });

async function saveSection(n, sys) {
  const key = sys ? 'sys:' + sys : 's' + n; const s = sec(String(n), sys);
  const content = EDIT[key] || (s && s.content) || {};
  if (n === 3) content.scopeSystems = String(content.scope_text || '').split('\n').map(x => x.trim()).filter(Boolean);
  const r = await call('save_section', { section: String(n), system_id: sys || '', content, base_version: s ? s.version : 0 });
  if (r.body.ok) { delete EDIT[key]; toast('saved, version ' + r.body.version); await load(); return true; }
  toast(r.body.error === 'conflict' ? 'someone saved a newer version. reload to see it.' : (r.body.error || 'not saved'), true);
  return false;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.getAttribute('data-act'), sys = t.getAttribute('data-sys'), d = deal();
  if (a === 'inv-none' || a === 'inv-sw' || a === 'func-review') return;
  t.disabled = true;
  try {
    if (a === 'si-send') { SIGN.email = val('si-email'); const r = await call('request_code', { email: SIGN.email }); if (r.status === 200) { SIGN.stage = 'code'; render(); } else toast('try again', true); }
    else if (a === 'si-back') { SIGN.stage = 'email'; render(); }
    else if (a === 'si-verify') { const r = await call('verify_code', { email: SIGN.email, code: val('si-code') }); if (r.body.ok) { setToken(r.body.session_token); SIGN.stage = 'email'; await load(); } else toast('that code did not work', true); }
    else if (a === 'sign-out') { await call('sign_out'); setToken(''); D = null; render(); }
    else if (a === 'save-s1') await saveSection(1);
    else if (a === 'save-s2') await saveSection(2);
    else if (a === 'inv-status') invSetStatus(t.getAttribute('data-k'), t.getAttribute('data-v'));
    else if (a === 'inv-unresolved') invSetUnresolved(t.getAttribute('data-k'));
    else if (a === 'sw-open') { const k = t.getAttribute('data-k'); SWOPEN[k] = !SWOPEN[k]; render(); }
    else if (a === 'suggest') { toast('reading your section 1 answers…'); const r = await call2('suggest', { extra: val('assist-extra') });
      if (r.body && r.body.ok) { ingestSuggestions(r.body.suggestions);
        const n = Object.keys(SUGGEST).length + ADD.length; toast(n ? n + ' suggestion' + (n > 1 ? 's' : '') + ' ready to review below' : 'nothing to suggest yet — your section 1 answers did not give enough to go on'); render(); }
      else toast((r.body && r.body.error) || 'the assistant did not run', true); }
    else if (a === 'sugg-accept') await applySuggestion(t.getAttribute('data-k'));
    else if (a === 'sugg-unresolved') await markUnresolvedFromSuggestion(t.getAttribute('data-k'));
    else if (a === 'sugg-dismiss') await dismissSuggestion(t.getAttribute('data-k'));
    else if (a === 'cust-add') { const fk = t.getAttribute('data-k'); const inp = document.getElementById('cust-add-' + fk); addCustom(fk, inp ? inp.value : ''); }
    else if (a === 'cust-remove') invRemove(t.getAttribute('data-k'));
    else if (a === 'add-accept') await acceptAdditional(t.getAttribute('data-k'));
    else if (a === 'add-assign') { const id = t.getAttribute('data-k'); const sel = document.getElementById('assign-' + id); await assignAdditional(id, sel ? sel.value : ''); }
    else if (a === 'add-dismiss') await dismissAdditional(t.getAttribute('data-k'));
    else if (a === 'save-s3') await saveSection(3);
    else if (a === 'confirm-1') { const nm = val('confirm-name-1'); if (!nm) { toast('type your name to confirm', true); } else await act('section_confirm', { section: '1', name: nm }, 'section 1 confirmed'); }
    else if (a === 'confirm-2') { const nm = val('confirm-name-2'); if (!nm) { toast('type your name to confirm', true); } else await act('section_confirm', { section: '2', name: nm }, 'section 2 confirmed'); }
    else if (a === 'consult-done') await act('consultation_complete', { deal_id: val('deal-id') }, 'consultation complete');
    else if (a === 'confirm-3') await act('section3_confirm', { deal_id: d.deal_id }, 'scope confirmed');
    else if (a === 'review-3') await act('section3_review', { deal_id: d.deal_id }, 'released to pricing');
    else if (a === 'kickoff') await act('kickoff_record', { deal_id: d.deal_id, review_day: val('ko-day'), review_time: val('ko-time') }, 'kickoff recorded');
    else if (a === 'add-person') await act('participant_add', { email: val('pa-email'), name: val('pa-name'), role: val('pa-role'), systems: val('pa-systems').split(',').map(x => x.trim()).filter(Boolean) }, 'person added');
    else if (a === 'set-arin-approver') await act('approver_set', { participant_id: val('ap-arin'), party: 'arin', kind: 'approver', notice_ref: '' }, 'ar|in approver set');
    else if (a === 'set-client-approver') await act('approver_set', { participant_id: val('ap-client'), party: 'client', kind: 'approver', notice_ref: val('ap-notice') }, 'client approver set');
    else if (a === 'plan-confirm') await act('mapping_plan_confirm', { deal_id: d.deal_id }, 'mapping plan confirmed');
    else if (a === 'review-record') await act('mapping_review_record', { deal_id: d.deal_id, review_date: val('rv-date') || new Date().toISOString().slice(0, 10), attendees: [], systems: (D.authoritative.systems || []).map(x => x.system_id), decisions: val('rv-dec') }, 'review recorded');
    else if (a === 'plan-set') await act('mapping_plan_set', { system_id: sys, owner_id: val('mp-owner-' + sys), worker_id: val('mp-worker-' + sys), deadline: val('mp-deadline-' + sys) }, 'plan saved for ' + sys);
    else if (a === 'ev-add') await act('evidence_add', { system_id: sys, type: val('ev-type-' + sys), text: val('ev-text-' + sys), link: val('ev-link-' + sys) }, 'evidence added');
    else if (a === 'helper') { toast('drafting from the evidence...'); const r = await call('helper_run', { system_id: sys });
      if (r.body.ok) { DRAFT[sys] = { output: r.body.suggestion, validation: { rejected_citations: r.body.rejected_citations } }; toast(`draft ready. ${r.body.questions_created} question(s) sent.`); await load(); } else toast(r.body.error || 'helper did not run', true); }
    else if (a === 'use-draft') { const dr = DRAFT[sys] || ((D.authoritative.system_detail || {})[sys] || {}).latest_draft; const s = sec('4', sys);
      const doc = EDIT['sys:' + sys] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
      (dr.output.steps || []).forEach(st => { let target = doc.steps.find(x => x.step_id === st.step_id); if (!target) { target = { step_id: st.step_id, fields: {}, decision_logic: st.decision_logic, sends_message: !!st.sends_message }; doc.steps.push(target); }
        FIELDS.forEach(([f]) => { const v = st.fields && st.fields[f]; if (v && v.value !== 'unknown' && !(target.fields[f] && target.fields[f].accepted)) target.fields[f] = { value: v.value, accepted: false, from_draft: (v.citations[0] || {}).excerpt }; }); });
      EDIT['sys:' + sys] = doc; render(); toast('draft copied. tick accepted on each field you agree with, then save.'); }
    else if (a === 'add-step') { const s = sec('4', sys); const doc = EDIT['sys:' + sys] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] })); doc.steps.push({ step_id: 's' + (doc.steps.length + 1), fields: {}, decision_logic: null, sends_message: false }); EDIT['sys:' + sys] = doc; render(); }
    else if (a === 'rm-step') { const doc = EDIT['sys:' + sys]; if (doc) { doc.steps.splice(+t.getAttribute('data-i'), 1); render(); } }
    else if (a === 'save-sys') { const doc = EDIT['sys:' + sys]; if (doc) doc.steps.forEach(st => FIELDS.forEach(([f]) => { if (st.fields[f]) delete st.fields[f].from_draft; })); await saveSection(4, sys); }
    else if (a === 'answer') await act('question_answer', { question_id: t.getAttribute('data-q'), answer: val('qa-' + t.getAttribute('data-q')) }, 'answer saved as evidence');
    else if (a === 'dismiss') await act('question_dismiss', { question_id: t.getAttribute('data-q'), reason: 'not needed' }, 'question dismissed');
    else if (a === 'teach') await act('teach_it_record', { system_id: sys, result: t.getAttribute('data-r'), by: val('ti-by-' + sys) }, 'teach-it test recorded');
    else if (a === 'request-approval') await act('approval_request', { type: 'phase1', system_id: sys }, 'approval requested. ar|in approves first, by email link.');
  } finally { t.disabled = false; }
});
load();
</script>
</body>
</html>
