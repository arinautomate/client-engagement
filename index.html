<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ar|in engagement document (test)</title>
<style>
  :root { --red:#D11919; --dark:#62605C; --mid:#84817C; --subtle:#84817C; --light-bg:#EAE5DC; --border:#C8C4BC; --green:#2D6A4F; --amber:#b8750a; --blue:#1565c0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; color:var(--dark); background:#C8C4BC; line-height:1.55; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:220px; min-width:220px; background:#62605C; color:#EAE5DC; padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .logo { padding:0 20px 18px; border-bottom:1px solid #84817C; margin-bottom:12px; }
  .logo .word { font-size:30px; font-weight:300; letter-spacing:-1px; color:#EAE5DC; }
  .logo .word b { color:var(--red); font-weight:400; }
  .logo .doc-type { font-size:10px; color:#A6A29C; margin-top:4px; text-transform:uppercase; letter-spacing:.6px; }
  .nav-label { padding:14px 20px 4px; font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:#A6A29C; }
  .nav-item { display:block; padding:6px 20px; color:#C8C4BC; font-size:12px; cursor:pointer; text-decoration:none; }
  .nav-item:hover { color:#fff; }
  .sdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; background:#84817C; vertical-align:middle; }
  .sdot.active { background:var(--amber); } .sdot.done { background:#7fc49b; }
  .me { padding:10px 20px; font-size:11px; color:#C8C4BC; }
  .main { flex:1; padding:28px 36px 64px; max-width:1100px; }
  .testbar { background:#fff8dc; border:1px solid var(--amber); color:#7d5a00; font-size:11px; padding:7px 12px; margin-bottom:16px; }
  .doc-header { background:#fff; border:1px solid var(--border); border-left:3px solid var(--red); padding:20px 24px; margin-bottom:18px; }
  .doc-title { font-size:17px; font-weight:700; }
  .doc-title small { display:block; font-size:11px; font-weight:400; color:var(--subtle); margin-top:3px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spread { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .band { background:#fff; border:1px solid var(--border); padding:14px 20px; margin-bottom:18px; }
  .chip { display:inline-block; font-size:11px; padding:3px 9px; border:1px solid var(--border); background:#fafafa; color:var(--subtle); margin:2px 4px 2px 0; }
  .chip.done { background:#d4edda; border-color:var(--green); color:var(--green); font-weight:600; }
  .chip.warn { background:#fff3cd; border-color:var(--amber); color:#7d5a00; }
  .section { background:#fff; border:1px solid var(--border); margin-bottom:18px; }
  .section.locked .sec-body { opacity:.6; }
  .sec-header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sec-left { display:flex; align-items:center; gap:12px; }
  .sec-num { width:28px; height:28px; border-radius:50%; background:var(--dark); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .section.locked .sec-num { background:#bbb; }
  .sec-title { font-size:14px; font-weight:600; } .sec-sub { font-size:11px; color:var(--subtle); margin-top:2px; }
  .badge { font-size:11px; padding:3px 10px; font-weight:500; background:#f0f0f0; color:#888; white-space:nowrap; }
  .badge.ip { background:#fef3cd; color:#7d5a00; } .badge.so { background:#d4edda; color:#155724; } .badge.rm { background:#f8d7da; color:#9b1111; }
  .sec-body { padding:18px 22px; }
  .sec-foot { background:var(--light-bg); border-top:1px solid var(--border); padding:14px 22px; }
  .lock-notice { padding:18px 22px; color:var(--subtle); font-size:12px; }
  .note { font-size:11.5px; color:var(--subtle); margin-bottom:12px; }
  .fl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--subtle); margin-bottom:4px; }
  .fr { margin-bottom:12px; }
  textarea.fi, input.fi, select.fi { width:100%; border:1px solid var(--border); padding:7px 9px; font-size:13px; font-family:inherit; color:var(--dark); background:#fafafa; outline:none; }
  textarea.fi { min-height:56px; resize:vertical; line-height:1.5; }
  textarea.fi:focus, input.fi:focus, select.fi:focus { border-color:var(--red); background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .btn { padding:7px 16px; background:var(--dark); color:#fff; border:none; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .btn:hover { background:var(--red); } .btn:disabled { background:#bbb; cursor:default; }
  .btn.arin { background:#fff; color:var(--dark); border:1px solid var(--dark); }
  .btn.arin:hover { border-color:var(--red); color:var(--red); }
  .btn.small { padding:4px 10px; font-size:11px; }
  .card { border:1px solid var(--border); margin-bottom:14px; }
  .card-header { padding:10px 14px; background:var(--light-bg); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card-body { padding:14px; border-top:1px solid var(--border); }
  .sub { border:1px solid #e3dfd8; background:#fcfbf9; padding:12px; margin-bottom:12px; }
  .sub h4 { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--subtle); margin-bottom:8px; }
  .arin-only { border-left:3px solid var(--blue); }
  .arin-tag { font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--blue); margin-left:6px; }
  .step { border:1px solid var(--border); padding:10px; margin-bottom:10px; background:#fff; }
  .field-row { display:grid; grid-template-columns:120px 1fr 90px; gap:8px; align-items:start; margin-bottom:6px; }
  .field-row label.acc { font-size:11px; color:var(--subtle); display:flex; gap:4px; align-items:center; padding-top:7px; }
  .cite { font-size:11px; color:var(--subtle); margin:-2px 0 6px 128px; font-style:italic; }
  .q { border-left:3px solid var(--amber); padding:8px 10px; background:#fffdf6; margin-bottom:8px; }
  .gap { color:var(--red); font-size:11.5px; }
  .ok { color:var(--green); font-size:11.5px; }
  .msg { position:fixed; right:18px; bottom:18px; background:var(--dark); color:#fff; padding:10px 14px; font-size:12px; max-width:420px; display:none; z-index:9; }
  .msg.err { background:var(--red); }
  table.t { width:100%; border-collapse:collapse; font-size:12px; }
  table.t td, table.t th { border-bottom:1px solid #eee; padding:5px 6px; text-align:left; vertical-align:top; }
  table.t th { font-size:10px; text-transform:uppercase; color:var(--subtle); letter-spacing:.4px; }
  .signin { max-width:420px; margin:60px auto; background:#fff; border:1px solid var(--border); border-left:3px solid var(--red); padding:26px; }
  .muted { color:var(--subtle); font-size:11.5px; }
  .inv-dept { border:1px solid var(--border); margin-bottom:8px; }
  .inv-dept-h { padding:8px 12px; background:var(--light-bg); font-weight:700; font-size:12px; }
  .inv-row { display:grid; grid-template-columns:1fr 170px 1fr; gap:8px; padding:4px 12px; border-bottom:1px solid #f0ede8; align-items:center; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo"><div class="word">ar<b>|</b>in</div><div class="doc-type">client engagement</div></div>
    <div class="nav-label">sections</div>
    <a class="nav-item" href="#section-1"><span class="sdot" id="dot1"></span>01 critical client flow</a>
    <a class="nav-item" href="#section-2"><span class="sdot" id="dot2"></span>02 systems inventory</a>
    <a class="nav-item" href="#section-3"><span class="sdot" id="dot3"></span>03 consultation outcomes</a>
    <a class="nav-item" href="#section-plan"><span class="sdot" id="dotp"></span>contract and mapping plan</a>
    <a class="nav-item" href="#section-4"><span class="sdot" id="dot4"></span>04 system library</a>
    <a class="nav-item" href="#section-approvals">approvals</a>
    <div class="nav-label">signed in</div>
    <div class="me" id="me">not signed in</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="msg" id="msg"></div>
<script>
'use strict';
const API = 'https://arinautomate.app.n8n.cloud/webhook/ced-001-api';   // fixed: the session token is never sent to a user-supplied destination
const SLUG = new URLSearchParams(location.search).get('e') || '';
const TKEY = 'arin-ced-session:' + SLUG;
let D = null;           // last load
let EDIT = {};          // unsaved edits, kept across re-renders
let SIGN = { stage: 'email', email: '' };
let DRAFT = {};         // latest helper answer per system (also served from the record)

const CCF = [
  ['ccf-s1', 'how do you attract new clients?', 'e.g. advertising, referrals, linkedin content'],
  ['ccf-s2', 'how do clients first reach out?', 'e.g. consultation booking, phone call, contact form'],
  ['ccf-s3', 'how do you turn them into paying clients?', 'e.g. discovery call, emailed proposal, contract'],
  ['ccf-s4', 'how do you get paid?', 'e.g. invoice, subscription, deposit and final payment'],
  ['ccf-s5', 'how do you onboard a new client?', 'e.g. welcome call, kickoff'],
  ['ccf-s6', 'what do you deliver for them?', 'e.g. build website, cut hair'],
  ['ccf-s7', 'how do you keep them coming back?', 'e.g. campaigns, subscription, specials']];
const DEPTS = [
  ['marketing', ['lead generation', 'content creation and publishing', 'email marketing and newsletters', 'customer reviews and testimonials']],
  ['sales', ['sales calls and discovery', 'proposal and quote creation', 'contract and agreement', 'CRM management']],
  ['operations', ['client onboarding', 'service delivery', 'supplier and vendor management', 'inventory and stock management']],
  ['finance', ['invoicing and billing', 'accounts receivable and collections', 'accounts payable and payments', 'cash flow forecasting']],
  ['management', ['KPI and metrics reporting', 'decision making and approvals']]];
const INV_STATUS = ['', 'documented', 'not documented', 'not yet implemented', 'not applicable'];
const FIELDS = [['trigger', 'trigger'], ['inputs', 'required inputs'], ['action', 'action'], ['output', 'output'], ['routing', 'routing'], ['comms_template', 'communication template']];
const PIPE = [['p0', 'contract signed, 50% paid'], ['p1', 'mapping plan agreed'], ['p2', 'all systems documented'], ['p3', 'all systems signed off'], ['p4', 'library complete, handed to build']];
const ACTION_LABEL = { a01: 'book the kickoff', a02: 'confirm the mapping plan', a03: 'answer open questions', a04: 'weekly review', a05: 'phase 1 approval waiting', a06: 'mapping deadline passed' };

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => t ? new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const can = a => !!(D && D.actions && D.actions.indexOf(a) >= 0);
const isAdmin = () => D && D.role === 'arin_admin';
const token = () => { try { return sessionStorage.getItem(TKEY) || ''; } catch (e) { return ''; } };
function setToken(t) { try { t ? sessionStorage.setItem(TKEY, t) : sessionStorage.removeItem(TKEY); } catch (e) {} }
function toast(text, err) { const m = document.getElementById('msg'); m.textContent = text; m.className = 'msg' + (err ? ' err' : ''); m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 4500); }

async function call(action, args) {
  // form-encoded POST = CORS "simple request": no Authorization header, no preflight.
  // the session token travels in the body over HTTPS.
  const form = new URLSearchParams();
  form.set('action', action); form.set('slug', SLUG); form.set('token', token()); form.set('args', JSON.stringify(args || {}));
  const r = await fetch(API, { method: 'POST', body: form });
  let body = {}; try { body = await r.json(); } catch (e) {}
  if (r.status === 401 && action !== 'verify_code') { setToken(''); D = null; render(); }
  return { status: r.status, body };
}
async function act(action, args, okText) {
  const r = await call(action, args);
  if (r.body && r.body.ok) { if (okText) toast(okText); await load(); return r.body; }
  const e = (r.body && r.body.error) || ('error ' + r.status);
  toast(e === 'not authorised' ? 'not allowed for your role, or your session ended' : e, true);
  return null;
}
async function load() {
  if (!token()) { D = null; return render(); }
  const r = await call('load');
  D = r.body && r.body.ok ? r.body : null;
  render();
}
const sec = (s, sys) => D && D.sections.find(x => x.section === s && (x.system_id || '') === (sys || ''));
const deal = () => D && D.authoritative && D.authoritative.deals && D.authoritative.deals[0];
const person = id => (D.authoritative.participants || []).find(p => p.participant_id === id);

// ---------------- sign-in ----------------
function signinView() {
  if (!SLUG) return '<div class="signin"><div class="doc-title">no engagement selected<small>open the link from your email.</small></div></div>';
  if (SIGN.stage === 'email') return `<div class="signin"><div class="doc-title">sign in to your engagement document<small>enter the email address the link was sent to. we'll send you a 6-digit code.</small></div>
    <div class="fr" style="margin-top:16px"><div class="fl">email</div><input class="fi" id="si-email" type="email" autocomplete="email"></div>
    <button class="btn" data-act="si-send">send me a code</button></div>`;
  return `<div class="signin"><div class="doc-title">enter your code<small>if ${esc(SIGN.email)} is on this engagement, a code is on its way. it works for 10 minutes.</small></div>
    <div class="fr" style="margin-top:16px"><div class="fl">6-digit code</div><input class="fi" id="si-code" inputmode="numeric" maxlength="6"></div>
    <div class="row"><button class="btn" data-act="si-verify">sign in</button><button class="btn arin" data-act="si-back">use another email</button></div></div>`;
}

// ---------------- document ----------------
function header() {
  const e = D.engagement, me = D.me;
  return `<div class="doc-header"><div class="spread"><div class="doc-title">${esc(e.name)}<small>client engagement document · shared working document from consultation to run</small></div>
  <div class="muted" style="text-align:right">signed in as ${esc(me.name)}<br>${esc(me.role.replace('_', ' '))}<br><button class="btn small arin" data-act="sign-out" style="margin-top:6px">sign out</button></div></div></div>`;
}
function band() {
  const d = deal();
  if (!d) return `<div class="band"><span class="muted">no deal yet. ar|in opens one after the consultation.</span></div>`;
  const p = d.pipeline || {};
  const acts = (d.open_actions || []).map(a => `<span class="chip warn">${esc(ACTION_LABEL[a.type] || a.type)}${a.system_id ? ' · ' + esc(a.system_id) : ''}${a.due_on ? ' · due ' + esc(a.due_on) : ''}</span>`).join('');
  return `<div class="band"><div class="fl">progress</div>${PIPE.map(([k, l]) => `<span class="chip ${p[k] ? 'done' : ''}">${p[k] ? '✓ ' : ''}${esc(l)}</span>`).join('')}
    ${acts ? `<div class="fl" style="margin-top:10px">waiting on</div>${acts}` : ''}</div>`;
}
function sectionShell(id, num, title, sub, badge, badgeCls, body, locked) {
  return `<div class="section ${locked ? 'locked' : ''}" id="${id}"><div class="sec-header"><div class="sec-left"><div class="sec-num">${num}</div><div><div class="sec-title">${title}</div><div class="sec-sub">${sub}</div></div></div><span class="badge ${badgeCls || ''}">${esc(badge)}</span></div>${body}</div>`;
}
function savedLine(s) { return s ? `<span class="muted">version ${s.version} · saved by ${esc(s.updated_by || '')} · ${fmt(s.updated_at)}</span>` : '<span class="muted">not saved yet</span>'; }

function s1() {
  const s = sec('1'); const c = EDIT.s1 || (s && s.content) || {};
  const conf = D.authoritative.confirmations || {};
  const edit = can('save_section:1');
  const body = `<div class="sec-body"><p class="note">how your business goes from attracting a client to delivering and keeping them. a high-level picture.</p>
    <div class="grid2"><div class="fr"><div class="fl">who is your target client?</div><textarea class="fi" data-bind="s1.target" ${edit ? '' : 'readonly'}>${esc(c.target)}</textarea></div>
    <div class="fr"><div class="fl">what is the main product or solution?</div><textarea class="fi" data-bind="s1.product" ${edit ? '' : 'readonly'}>${esc(c.product)}</textarea></div></div>
    ${CCF.map(([id, q, h]) => `<div class="fr"><div class="fl">${esc(q)}</div><textarea class="fi" data-bind="s1.${id}" placeholder="${esc(h)}" ${edit ? '' : 'readonly'}>${esc(c[id])}</textarea></div>`).join('')}
    <div class="row">${edit ? '<button class="btn" data-act="save-s1">save section 1</button>' : ''}${savedLine(s)}</div></div>
    <div class="sec-foot"><div class="fl">confirmation</div>${conf.s1_confirmed_at ? `<span class="ok">confirmed ${fmt(conf.s1_confirmed_at)}${conf.s1_confirmed_name ? ' by ' + esc(conf.s1_confirmed_name) : ''}</span>` :
      (can('section_confirm') && s ? '<input class="fi" id="confirm-name-1" placeholder="type your name to confirm" style="max-width:260px;display:inline-block;margin-right:8px"><button class="btn" data-act="confirm-1">confirm section 1 is accurate</button>' : '<span class="muted">not confirmed yet</span>')}</div>`;
  return sectionShell('section-1', 1, 'critical client flow', 'filled by the client before the consultation', conf.s1_confirmed_at ? 'confirmed' : (s ? 'in progress' : 'not started'), conf.s1_confirmed_at ? 'so' : (s ? 'ip' : ''), body);
}
function s2() {
  const s = sec('2'); const c = EDIT.s2 || (s && s.content) || { inventory: {} };
  const inv = c.inventory || {};
  const conf = D.authoritative.confirmations || {};
  const edit = can('save_section:2');
  const body = `<div class="sec-body"><p class="note">which systems exist in your business today and whether they are written down.</p>
    ${DEPTS.map(([d, list]) => `<div class="inv-dept"><div class="inv-dept-h">${esc(d)}</div>${list.map(name => {
      const v = inv[name] || {};
      return `<div class="inv-row"><div>${esc(name)}</div><select class="fi" data-bind="s2.inventory.${esc(name)}.status" ${edit ? '' : 'disabled'}>${INV_STATUS.map(o => `<option ${o === (v.status || '') ? 'selected' : ''} value="${esc(o)}">${esc(o || 'choose')}</option>`).join('')}</select>
      <input class="fi" data-bind="s2.inventory.${esc(name)}.software" placeholder="software used" value="${esc(v.software)}" ${edit ? '' : 'readonly'}></div>`; }).join('')}</div>`).join('')}
    <div class="row" style="margin-top:10px">${edit ? '<button class="btn" data-act="save-s2">save section 2</button>' : ''}${savedLine(s)}</div></div>
    <div class="sec-foot"><div class="fl">confirmation</div>${conf.s2_confirmed_at ? `<span class="ok">confirmed ${fmt(conf.s2_confirmed_at)}${conf.s2_confirmed_name ? ' by ' + esc(conf.s2_confirmed_name) : ''}</span>` :
      (can('section_confirm') && s ? `${conf.s1_confirmed_at ? '<input class="fi" id="confirm-name-2" placeholder="type your name to confirm" style="max-width:260px;display:inline-block;margin-right:8px">' : ''}<button class="btn" data-act="confirm-2" ${conf.s1_confirmed_at ? '' : 'disabled'}>confirm section 2 is accurate</button> ${conf.s1_confirmed_at ? '' : '<span class="muted">confirm section 1 first</span>'}` : '<span class="muted">not confirmed yet</span>')}
    ${can('consultation_complete') && !deal() ? `<div class="sub arin-only" style="margin-top:14px"><h4>after the consultation<span class="arin-tag">ar|in only</span></h4>
      <div class="row"><input class="fi" style="max-width:220px" id="deal-id" placeholder="HubSpot deal id"><button class="btn arin" data-act="consult-done">consultation completed, open section 3</button></div></div>` : ''}</div>`;
  return sectionShell('section-2', 2, 'systems inventory', 'filled by the client before the consultation', conf.s2_confirmed_at ? 'confirmed' : (s ? 'in progress' : 'not started'), conf.s2_confirmed_at ? 'so' : (s ? 'ip' : ''), body);
}
function s3() {
  const d = deal();
  if (!d) return sectionShell('section-3', 3, 'consultation outcomes', 'scope and pricing assumptions agreed in the consultation', 'locked', '', '<div class="lock-notice">opens after ar|in marks the consultation complete.</div>', true);
  const s = sec('3'); const c = EDIT.s3 || (s && s.content) || {};
  const s3 = d.section3 || {};
  const edit = can('save_section:3');
  const status = s3.reviewed_at && !s3.changed_since_confirmation ? 'confirmed and released for pricing' : (s3.confirmed_at && !s3.changed_since_confirmation ? 'confirmed, waiting for ar|in review' : (s3.changed_since_confirmation ? 'changed since confirmation' : (s ? 'drafted' : 'not started')));
  const body = `<div class="sec-body"><p class="note">ar|in records the systems in scope and the assumptions the quote is based on. the client confirms. the proposal is priced only on the confirmed version.</p>
    <div class="fr"><div class="fl">systems in scope <span class="muted">(one per line, with a short id)</span></div><textarea class="fi" data-bind="s3.scope_text" ${edit ? '' : 'readonly'} style="min-height:80px">${esc(c.scope_text)}</textarea></div>
    <div class="fr"><div class="fl">pricing assumptions</div><textarea class="fi" data-bind="s3.assumptions" ${edit ? '' : 'readonly'}>${esc(c.assumptions)}</textarea></div>
    <div class="row">${edit ? '<button class="btn arin" data-act="save-s3">save section 3</button>' : ''}${savedLine(s)}</div></div>
    <div class="sec-foot"><div class="fl">status: ${esc(status)}</div>
      ${can('section3_confirm') && s && (!s3.confirmed_at || s3.changed_since_confirmation) ? '<button class="btn" data-act="confirm-3">confirm scope and assumptions</button>' : ''}
      ${can('section3_review') && s3.confirmed_at && !s3.changed_since_confirmation && !s3.reviewed_at ? '<button class="btn arin" data-act="review-3">reviewed, release to pricing</button>' : ''}
      ${s3.confirmed_at ? `<div class="muted" style="margin-top:6px">confirmed ${fmt(s3.confirmed_at)}${s3.reviewed_at ? ' · reviewed by ar|in ' + fmt(s3.reviewed_at) : ''}</div>` : ''}</div>`;
  return sectionShell('section-3', 3, 'consultation outcomes', 'scope and pricing assumptions agreed in the consultation', status, s3.reviewed_at ? 'so' : 'ip', body);
}
function planSection() {
  const d = deal();
  if (!d || !d.signed_at) return sectionShell('section-plan', '·', 'contract and mapping plan', 'from the signed contract and the first payment', 'waiting for the contract', '', '<div class="lock-notice">shows once the contract is signed. the 50% first payment unlocks detailed mapping.</div>', true);
  const parts = D.authoritative.participants || [];
  const appr = D.authoritative.approvers || [];

function bindValue(path, value) {
  const [root, ...rest] = path.split('.');
  if (root === 's1' || root === 's2' || root === 's3') {
    const key = root, base = EDIT[key] || JSON.parse(JSON.stringify((sec(root.slice(1)) || {}).content || (root === 's2' ? { inventory: {} } : {})));
    if (root === 's2') { base.inventory = base.inventory || {}; const status = rest[rest.length - 1]; const name = rest.slice(1, -1).join('.'); base.inventory[name] = base.inventory[name] || {}; base.inventory[name][status] = value; }
    else base[rest[0]] = value;
    EDIT[key] = base; return;
  }
  if (root === 'sys') {
    const sys = rest[0], i = +rest[1], f = rest[2], sub = rest[3];
    const key = 'sys:' + sys; const s = sec('4', sys);
    const doc = EDIT[key] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
    const st = doc.steps[i]; if (!st) return;
    st.fields = st.fields || {};
    if (f === 'decision_logic') st.decision_logic = value || null;
    else if (f === 'sends_message') st.sends_message = !!value;
    else { st.fields[f] = st.fields[f] || { value: '', accepted: false };
      if (sub === 'accepted') st.fields[f].accepted = !!value;
      else { const lines = String(value).split('\n').map(x => x.trim()).filter(Boolean); st.fields[f].value = (f === 'routing' && lines.length > 1) ? lines : String(value); } }
    EDIT[key] = doc;
  }
}
document.addEventListener('input', e => { const b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) bindValue(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); });
document.addEventListener('change', e => { const b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) bindValue(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); });

async function saveSection(n, sys) {

  else toast(r.body.error === 'conflict' ? 'someone saved a newer version. reload to see it.' : (r.body.error || 'not saved'), true);

      EDIT['sys:' + sys] = doc; render(); toast('draft copied. tick accepted on each field you agree with, then save.'); }
    else if (a === 'add-step') { const s = sec('4', sys); const doc = EDIT['sys:' + sys] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] })); doc.steps.push({ step_id: 's' + (doc.steps.length + 1), fields: {}, decision_logic: null, sends_message: false }); EDIT['sys:' + sys] = doc; render(); }
    else if (a === 'rm-step') { const doc = EDIT['sys:' + sys]; if (doc) { doc.steps.splice(+t.getAttribute('data-i'), 1); render(); } }
    else if (a === 'save-sys') { const doc = EDIT['sys:' + sys]; if (doc) doc.steps.forEach(st => FIELDS.forEach(([f]) => { if (st.fields[f]) delete st.fields[f].from_draft; })); await saveSection(4, sys); }
    else if (a === 'answer') await act('question_answer', { question_id: t.getAttribute('data-q'), answer: val('qa-' + t.getAttribute('data-q')) }, 'answer saved as evidence');
    else if (a === 'dismiss') await act('question_dismiss', { question_id: t.getAttribute('data-q'), reason: 'not needed' }, 'question dismissed');
    else if (a === 'teach') await act('teach_it_record', { system_id: sys, result: t.getAttribute('data-r'), by: val('ti-by-' + sys) }, 'teach-it test recorded');
    else if (a === 'request-approval') await act('approval_request', { type: 'phase1', system_id: sys }, 'approval requested. ar|in approves first, by email link.');
  } finally { t.disabled = false; }
});
load();
</script>
