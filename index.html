async function call(action, args) {

  const form = new URLSearchParams();
  form.set('action', action); form.set('slug', SLUG); form.set('token', token()); form.set('args', JSON.stringify(args || {}));
  const r = await fetch(API, { method: 'POST', body: form });
  let body = {}; try { body = await r.json(); } catch (e) {}
  if (r.status === 401 && action !== 'verify_code') { setToken(''); D = null; render(); }
  return { status: r.status, body };
}
async function act(action, args, okText) {
  const r = await call(action, args);
  if (r.body && r.body.ok) { if (okText) toast(okText); await load(); return r.body; }
  const e = (r.body && r.body.error) || ('error ' + r.status);
  toast(e === 'not authorised' ? 'not allowed for your role, or your session ended' : e, true);
  return null;
}

function bindValue(path, value) {
  const [root, ...rest] = path.split('.');
  if (root === 's1' || root === 's2' || root === 's3') {
    const key = root, base = EDIT[key] || JSON.parse(JSON.stringify((sec(root.slice(1)) || {}).content || (root === 's2' ? { inventory: {} } : {})));
    if (root === 's2') { base.inventory = base.inventory || {}; base.owners = base.owners || {};
      if (rest[0] === 'owners') { const dk = rest[1], f = rest[2]; base.owners[dk] = base.owners[dk] || {}; base.owners[dk][f] = value; }
      else { const field = rest[rest.length - 1]; const name = rest.slice(1, -1).join('.'); base.inventory[name] = base.inventory[name] || {}; base.inventory[name][field] = value; } }
    else base[rest[0]] = value;
    EDIT[key] = base; return;
  }
  if (root === 'sys') {
    const sys = rest[0], i = +rest[1], f = rest[2], sub = rest[3];
    const key = 'sys:' + sys; const s = sec('4', sys);
    const doc = EDIT[key] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
    const st = doc.steps[i]; if (!st) return;
    st.fields = st.fields || {};
    if (f === 'decision_logic') st.decision_logic = value || null;
    else if (f === 'sends_message') st.sends_message = !!value;
    else { st.fields[f] = st.fields[f] || { value: '', accepted: false };
      if (sub === 'accepted') st.fields[f].accepted = !!value;
      else { const lines = String(value).split('\n').map(x => x.trim()).filter(Boolean); st.fields[f].value = (f === 'routing' && lines.length > 1) ? lines : String(value); } }
    EDIT[key] = doc;
  }
}

function s2buf() { if (!EDIT.s2) EDIT.s2 = JSON.parse(JSON.stringify((sec('2') || {}).content || {})); EDIT.s2.inventory = EDIT.s2.inventory || {}; EDIT.s2.owners = EDIT.s2.owners || {}; EDIT.s2.coverage = EDIT.s2.coverage || {}; return EDIT.s2; }

function invSetStatus(k, v) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const now = (b.inventory[k].status === v ? '' : v); b.inventory[k].status = now; if (now) b.inventory[k].unresolved = false; render(); }
function invSetUnresolved(k) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const on = !b.inventory[k].unresolved; b.inventory[k].unresolved = on; if (on) b.inventory[k].status = ''; render(); }
// software selection with combination rules (correction 3):
//  - "no software used" (__none__): exclusive with named tools / "other" / "not sure"; COMPATIBLE with paper + outside provider
//  - "paper" (__paper__) and "outside provider" (__outsourced__): combine with named tools, each other, and "no software used"
//      (a mixed internal/outsourced arrangement = a named tool AND "outside provider" together)
//  - "not sure" (__unsure_tools__): exclusive, chosen alone
//  - a named tool: clears "no software used" / "not sure" / the legacy token
//  - the legacy 'no software / paper-based' token is preserved verbatim and only removed when the client changes something (E2)
function invToggleSwToken(k, tok, on) {
  const b = s2buf(); b.inventory[k] = b.inventory[k] || {};
  let arr = Array.isArray(b.inventory[k].software) ? b.inventory[k].software.slice() : [];
  if (on) {
    if (tok === '__unsure_tools__') { arr = ['__unsure_tools__']; b.inventory[k].other = ''; }
    else if (tok === '__none__') { arr = arr.filter(x => x === '__paper__' || x === '__outsourced__'); arr.push('__none__'); b.inventory[k].other = ''; }
    else if (tok === 'no software / paper-based') { /* legacy is shown already-checked; turning it on is a no-op */ }
    else if (tok === '__paper__' || tok === '__outsourced__') {
      arr = arr.filter(x => x !== '__unsure_tools__' && x !== 'no software / paper-based');
      if (!arr.includes(tok)) arr.push(tok);
    } else { // a named tool
      arr = arr.filter(x => x !== '__none__' && x !== '__unsure_tools__' && x !== 'no software / paper-based');
      if (!arr.includes(tok)) arr.push(tok);
    }
  } else {
    arr = arr.filter(x => x !== tok);
  }
  b.inventory[k].software = arr; render();
}

// Verify the specific activity was corrected. For an inconsistency, a software
// change does not qualify: the client must correct its mistaken not-done status.
function isSavedFix(fx, savedInv) {
  if (!fx || !fx.sys || !fx.before) return false;
  const after = (savedInv && savedInv[fx.sys]) || {};
  if (fx.findingType === 'inconsistency') {
    const before = JSON.parse(fx.before);
    return ['not applicable', 'not yet implemented'].includes(before.status)
      && ['documented', 'not documented'].includes(after.status);
  }
  return JSON.stringify(after) !== fx.before;
}
// Resolve after successful save and before load() marks the assessment stale.
// Retain a retryable action if the resolution request itself fails.
async function resolveSavedFixesAfterSave(savedInv) {
  let failures = 0;
  for (const id of Object.keys(FIX)) {
    const fx = FIX[id];
    if (!fx || !['armed', 'ready'].includes(fx.state) || !isSavedFix(fx, savedInv)) continue;
    try {
      const r = await call2('finding_resolve', { finding_id: id, action: 'applied' });
      if (r && r.body && r.body.ok) delete FIX[id];
      else { fx.state = 'ready'; failures++; }
    } catch (e) { fx.state = 'ready'; failures++; }
  }
  return failures;
}

    else if (a === 'run-assess') { toast('reviewing your inventory…'); await runAssessment(); }
    else if (a === 'find-fix') { const id = t.getAttribute('data-k'); const sysName = t.getAttribute('data-sys-name'); const savedInv = ((sec('2') || {}).content || {}).inventory || {}; FIX[id] = { state: 'armed', sys: sysName, before: JSON.stringify(savedInv[sysName] || {}), findingType: (FINDINGS.findings.find(f => f.finding_id === id) || {}).finding_type || null }; const el = document.getElementById(rowSlug(sysName)); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); render(); }
    else if (a === 'find-apply') { const id = t.getAttribute('data-k'); await resolveFinding(id, 'applied'); delete FIX[id]; }
    else if (a === 'find-dismiss') { const id = t.getAttribute('data-k'); await resolveFinding(id, 'dismissed'); delete FIX[id]; }
    else if (a === 'find-consult') { const id = t.getAttribute('data-k'); await resolveFinding(id, 'for_consultation'); delete FIX[id]; }
    else if (a === 'find-add') await applyOmission(t.getAttribute('data-k'), t.getAttribute('data-fk'), t.getAttribute('data-label'));
    else if (a === 'cust-add') { const fk = t.getAttribute('data-k'); const inp = document.getElementById('cust-add-' + fk); addCustom(fk, inp ? inp.value : ''); }
    else if (a === 'cust-remove') invRemove(t.getAttribute('data-k'));
    else if (a === 'save-s3') await saveSection(3);
    else if (a === 'confirm-1') { const nm = val('confirm-name-1'); if (!nm) { toast('type your name to confirm', true); } else await act('section_confirm', { section: '1', name: nm }, 'section 1 confirmed'); }
    else if (a === 'confirm-2') { const nm = val('confirm-name-2'); if (!nm) { toast('type your name to confirm', true); } else await act('section_confirm', { section: '2', name: nm }, 'section 2 confirmed'); }
    else if (a === 'consult-done') await act('consultation_complete', { deal_id: val('deal-id') }, 'consultation complete');
    else if (a === 'confirm-3') await act('section3_confirm', { deal_id: d.deal_id }, 'scope confirmed');
    else if (a === 'review-3') await act('section3_review', { deal_id: d.deal_id }, 'released to pricing');
    else if (a === 'kickoff') await act('kickoff_record', { deal_id: d.deal_id, review_day: val('ko-day'), review_time: val('ko-time') }, 'kickoff recorded');
    else if (a === 'add-person') await act('participant_add', { email: val('pa-email'), name: val('pa-name'), role: val('pa-role'), systems: val('pa-systems').split(',').map(x => x.trim()).filter(Boolean) }, 'person added');
    else if (a === 'set-arin-approver') await act('approver_set', { participant_id: val('ap-arin'), party: 'arin', kind: 'approver', notice_ref: '' }, 'ar|in approver set');
    else if (a === 'set-client-approver') await act('approver_set', { participant_id: val('ap-client'), party: 'client', kind: 'approver', notice_ref: val('ap-notice') }, 'client approver set');
    else if (a === 'plan-confirm') await act('mapping_plan_confirm', { deal_id: d.deal_id }, 'mapping plan confirmed');
    else if (a === 'review-record') await act('mapping_review_record', { deal_id: d.deal_id, review_date: val('rv-date') || new Date().toISOString().slice(0, 10), attendees: [], systems: (D.authoritative.systems || []).map(x => x.system_id), decisions: val('rv-dec') }, 'review recorded');
    else if (a === 'plan-set') await act('mapping_plan_set', { system_id: sys, owner_id: val('mp-owner-' + sys), worker_id: val('mp-worker-' + sys), deadline: val('mp-deadline-' + sys) }, 'plan saved for ' + sys);
    else if (a === 'ev-add') await act('evidence_add', { system_id: sys, type: val('ev-type-' + sys), text: val('ev-text-' + sys), link: val('ev-link-' + sys) }, 'evidence added');
    else if (a === 'helper') { toast('drafting from the evidence...'); const r = await call('helper_run', { system_id: sys });
      if (r.body.ok) { DRAFT[sys] = { output: r.body.suggestion, validation: { rejected_citations: r.body.rejected_citations } }; toast(`draft ready. ${r.body.questions_created} question(s) sent.`); await load(); } else toast(r.body.error || 'helper did not run', true); }
    else if (a === 'use-draft') { const dr = DRAFT[sys] || ((D.authoritative.system_detail || {})[sys] || {}).latest_draft; const s = sec('4', sys);
      const doc = EDIT['sys:' + sys] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
      (dr.output.steps || []).forEach(st => { let target = doc.steps.find(x => x.step_id === st.step_id); if (!target) { target = { step_id: st.step_id, fields: {}, decision_logic: st.decision_logic, sends_message: !!st.sends_message }; doc.steps.push(target); }
        FIELDS.forEach(([f]) => { const v = st.fields && st.fields[f]; if (v && v.value !== 'unknown' && !(target.fields[f] && target.fields[f].accepted)) target.fields[f] = { value: v.value, accepted: false, from_draft: (v.citations[0] || {}).excerpt }; }); });
      EDIT['sys:' + sys] = doc; render(); toast('draft copied. tick accepted on each field you agree with, then save.'); }
    else if (a === 'add-step') { const s = sec('4', sys); const doc = EDIT['sys:' + sys] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] })); doc.steps.push({ step_id: 's' + (doc.steps.length + 1), fields: {}, decision_logic: null, sends_message: false }); EDIT['sys:' + sys] = doc; render(); }
    else if (a === 'rm-step') { const doc = EDIT['sys:' + sys]; if (doc) { doc.steps.splice(+t.getAttribute('data-i'), 1); render(); } }
    else if (a === 'save-sys') { const doc = EDIT['sys:' + sys]; if (doc) doc.steps.forEach(st => FIELDS.forEach(([f]) => { if (st.fields[f]) delete st.fields[f].from_draft; })); await saveSection(4, sys); }
    else if (a === 'answer') await act('question_answer', { question_id: t.getAttribute('data-q'), answer: val('qa-' + t.getAttribute('data-q')) }, 'answer saved as evidence');
    else if (a === 'dismiss') await act('question_dismiss', { question_id: t.getAttribute('data-q'), reason: 'not needed' }, 'question dismissed');
    else if (a === 'teach') await act('teach_it_record', { system_id: sys, result: t.getAttribute('data-r'), by: val('ti-by-' + sys) }, 'teach-it test recorded');
    else if (a === 'request-approval') await act('approval_request', { type: 'phase1', system_id: sys }, 'approval requested. ar|in approves first, by email link.');
  } finally { t.disabled = false; }
});
load();
</script>
