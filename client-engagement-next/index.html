<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ar|in engagement document</title>
<style>
  :root { --red:#D11919; --dark:#62605C; --mid:#84817C; --subtle:#84817C; --light-bg:#EAE5DC; --border:#C8C4BC; --green:#2D6A4F; --amber:#b8750a; --blue:#1565c0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; color:var(--dark); background:#C8C4BC; line-height:1.55; }
  .app { display:flex; min-height:100vh; }
  .sidebar { width:220px; min-width:220px; background:#62605C; color:#EAE5DC; padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .logo { padding:0 20px 18px; border-bottom:1px solid #84817C; margin-bottom:12px; }
  .logo .word { font-size:30px; font-weight:300; letter-spacing:-1px; color:#EAE5DC; }
  .logo .word b { color:var(--red); font-weight:400; }
  .logo .doc-type { font-size:10px; color:#A6A29C; margin-top:4px; text-transform:uppercase; letter-spacing:.6px; }
  .nav-label { padding:14px 20px 4px; font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:#A6A29C; }
  .nav-item { display:block; padding:6px 20px; color:#C8C4BC; font-size:12px; cursor:pointer; text-decoration:none; }
  .nav-item:hover { color:#fff; }
  .sdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; background:#84817C; vertical-align:middle; }
  .sdot.active { background:var(--amber); } .sdot.done { background:#7fc49b; }
  .me { padding:10px 20px; font-size:11px; color:#C8C4BC; }
  .main { flex:1; padding:28px 36px 64px; max-width:1100px; }
  .doc-header { background:#fff; border:1px solid var(--border); border-left:3px solid var(--red); padding:20px 24px; margin-bottom:18px; }
  .doc-title { font-size:17px; font-weight:700; }
  .doc-title small { display:block; font-size:11px; font-weight:400; color:var(--subtle); margin-top:3px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .spread { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .band { background:#fff; border:1px solid var(--border); padding:14px 20px; margin-bottom:18px; }
  .chip { display:inline-block; font-size:11px; padding:3px 9px; border:1px solid var(--border); background:#fafafa; color:var(--subtle); margin:2px 4px 2px 0; }
  .chip.done { background:#d4edda; border-color:var(--green); color:var(--green); font-weight:600; }
  .chip.warn { background:#fff3cd; border-color:var(--amber); color:#7d5a00; }
  .section { background:#fff; border:1px solid var(--border); margin-bottom:18px; }
  .section.locked .sec-body { opacity:.6; }
  .sec-header { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sec-left { display:flex; align-items:center; gap:12px; }
  .sec-num { width:28px; height:28px; border-radius:50%; background:var(--dark); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .section.locked .sec-num { background:#bbb; }
  .sec-title { font-size:14px; font-weight:600; } .sec-sub { font-size:11px; color:var(--subtle); margin-top:2px; }
  .badge { font-size:11px; padding:3px 10px; font-weight:500; background:#f0f0f0; color:#888; white-space:nowrap; }
  .badge.ip { background:#fef3cd; color:#7d5a00; } .badge.so { background:#d4edda; color:#155724; } .badge.rm { background:#f8d7da; color:#9b1111; }
  .sec-body { padding:18px 22px; }
  .sec-foot { background:var(--light-bg); border-top:1px solid var(--border); padding:14px 22px; }
  .lock-notice { padding:18px 22px; color:var(--subtle); font-size:12px; }
  .note { font-size:11.5px; color:var(--subtle); margin-bottom:12px; }
  .fl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--subtle); margin-bottom:4px; }
  .fr { margin-bottom:12px; }
  textarea.fi, input.fi, select.fi { width:100%; border:1px solid var(--border); padding:7px 9px; font-size:13px; font-family:inherit; color:var(--dark); background:#fafafa; outline:none; }
  textarea.fi { min-height:56px; resize:vertical; line-height:1.5; }
  textarea.fi:focus, input.fi:focus, select.fi:focus { border-color:var(--red); background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .btn { padding:7px 16px; background:var(--dark); color:#fff; border:none; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .btn:hover { background:var(--red); } .btn:disabled { background:#bbb; cursor:default; }
  .btn.arin { background:#fff; color:var(--dark); border:1px solid var(--dark); }
  .btn.arin:hover { border-color:var(--red); color:var(--red); }
  .btn.small { padding:4px 10px; font-size:11px; }
  .card { border:1px solid var(--border); margin-bottom:14px; }
  .card-header { padding:10px 14px; background:var(--light-bg); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card-body { padding:14px; border-top:1px solid var(--border); }
  .sub { border:1px solid #e3dfd8; background:#fcfbf9; padding:12px; margin-bottom:12px; }
  .sub h4 { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--subtle); margin-bottom:8px; }
  .arin-only { border-left:3px solid var(--blue); }
  .arin-tag { font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--blue); margin-left:6px; }
  .step { border:1px solid var(--border); padding:10px; margin-bottom:10px; background:#fff; }
  .field-row { display:grid; grid-template-columns:120px 1fr 90px; gap:8px; align-items:start; margin-bottom:6px; }
  .field-row label.acc { font-size:11px; color:var(--subtle); display:flex; gap:4px; align-items:center; padding-top:7px; }
  .cite { font-size:11px; color:var(--subtle); margin:-2px 0 6px 128px; font-style:italic; }
  .q { border-left:3px solid var(--amber); padding:8px 10px; background:#fffdf6; margin-bottom:8px; }
  .gap { color:var(--red); font-size:11.5px; }
  .ok { color:var(--green); font-size:11.5px; }
  .msg { position:fixed; right:18px; bottom:18px; background:var(--dark); color:#fff; padding:10px 14px; font-size:12px; max-width:420px; display:none; z-index:9; }
  .msg.err { background:var(--red); }
  table.t { width:100%; border-collapse:collapse; font-size:12px; }
  table.t td, table.t th { border-bottom:1px solid #eee; padding:5px 6px; text-align:left; vertical-align:top; }
  table.t th { font-size:10px; text-transform:uppercase; color:var(--subtle); letter-spacing:.4px; }
  .signin { max-width:420px; margin:60px auto; background:#fff; border:1px solid var(--border); border-left:3px solid var(--red); padding:26px; }
  .muted { color:var(--subtle); font-size:11.5px; }
  .inv-dept { border:1px solid var(--border); margin-bottom:8px; }
  .inv-dept-h { padding:8px 12px; background:var(--light-bg); font-weight:700; font-size:12px; }
  .inv-dept-h { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .dept-owner { display:inline-flex; gap:6px; }
  .dept-owner .fi { max-width:150px; font-size:11px; padding:3px 6px; }
  .inv-row { display:grid; grid-template-columns:1fr; gap:6px; padding:8px 12px; border-bottom:1px solid #f0ede8; align-items:start; }
  .inv-sys { font-weight:600; font-size:12px; }
  .inv-stats { display:flex; flex-wrap:wrap; gap:6px; }
  .inv-stat { font-size:10.5px; padding:3px 8px; border:1px solid var(--border); background:#fff; color:var(--subtle); cursor:pointer; border-radius:3px; }
  .inv-stat.on { background:var(--dark); color:#fff; border-color:var(--dark); }
  .inv-stat:disabled { cursor:default; opacity:.6; }
  .inv-sw { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .sw-item { font-size:10.5px; color:var(--subtle); display:inline-flex; gap:3px; align-items:center; cursor:pointer; }
  .sw-item.on { color:var(--dark); }
  .sw-other { max-width:180px !important; font-size:10.5px; padding:2px 6px; }
  /* --- s2 assistant + compact inventory --- */
  .assist { border:1px solid var(--blue); background:#f3f8ff; padding:12px 14px; margin-bottom:14px; }
  .assist h4 { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--blue); margin-bottom:6px; }
  .assist textarea.fi { min-height:38px; margin:6px 0; }
  /* s2 redesign */
  .s2-intro { margin-bottom:12px; }
  .s2-intro .legend { list-style:none; margin:8px 0; padding:8px 10px; background:#faf8f4; border:1px solid var(--border); border-radius:4px; }
  .s2-intro .legend li { font-size:11px; color:var(--dark); padding:1px 0; }
  .wdtm { margin:3px 0 2px; }
  .wdtm .wdtm-body { font-size:11px; margin-top:3px; max-width:620px; }
  .wdtm .lnk { font-size:10.5px; }
  .sw-prompt { font-size:10.5px; color:var(--dark); font-weight:600; width:100%; margin-bottom:2px; }
  .assess-box { border:1px solid var(--blue); background:#f3f8ff; padding:12px 14px; margin:14px 0; }
  .assess-box h4 { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--blue); margin-bottom:6px; }
  .assess-box textarea.fi { min-height:38px; margin:6px 0; }
  .finding { border-left:3px solid var(--blue); background:#fff; padding:8px 10px; margin:8px 0; font-size:11.5px; }
  .finding b { text-transform:uppercase; font-size:10px; letter-spacing:.3px; color:var(--blue); }
  .finding .why { font-size:10.5px; color:var(--subtle); margin:4px 0; font-style:italic; }
  .meter { display:flex; gap:10px; align-items:center; font-size:10.5px; color:var(--subtle); flex-wrap:wrap; }
  .meter .bar { width:120px; height:7px; background:#e3dfd8; border-radius:4px; overflow:hidden; display:inline-flex; }
  .meter .bar i { height:100%; display:block; }
  .meter .bar i.ok { background:var(--green); } .meter .bar i.uns { background:var(--amber); }
  .pill { font-size:10px; padding:1px 6px; border-radius:3px; font-weight:600; }
  .pill.ok { background:#d4edda; color:var(--green); } .pill.uns { background:#fff3cd; color:#7d5a00; } .pill.todo { background:#eee; color:var(--subtle); } .pill.add { background:#e7f0ff; color:var(--blue); }
  .sugg.add { border-left-color:#c79a2e; background:#fffaf0; }
  .cov { margin:8px 0 4px; padding-top:8px; border-top:1px dashed var(--border); }
  .rev { display:flex; gap:6px; align-items:flex-start; font-size:11px; color:var(--dark); margin-top:6px; cursor:pointer; }
  .rev.blocked { color:var(--subtle); }
  .inv-stat.uns.on { background:var(--amber); border-color:var(--amber); color:#fff; }
  .sw-chips { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .sw-chip { font-size:10px; padding:1px 7px; background:#f0ede8; border:1px solid var(--border); border-radius:3px; }
  .lnk { font-size:10.5px; color:var(--blue); cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; }
  .sugg { border-left:3px solid var(--blue); background:#f3f8ff; padding:7px 10px; margin-top:4px; font-size:11px; }
  .sugg .why { color:var(--subtle); font-style:italic; margin-top:3px; }
  .sugg .row { margin-top:5px; gap:6px; }
.pc-stage,.pc-stage-result{border:1px solid #C8C4BC;padding:12px;margin:12px 0;border-radius:6px}
.pc-opt{display:block;margin:8px 0}.pc-custom-row{display:flex;gap:8px;margin:7px 0;flex-wrap:wrap}
.pc-custom-label{min-width:180px;flex:1}.pc-custom-status{max-width:190px}
.pc-save-error{color:#b22222;font-weight:600}.pc-source{margin-top:22px}
.pc-item{padding:5px 0}.pc-muted{color:#62605C}.pc-warn{border-left:3px solid #D11919;padding-left:8px}

/* OPS-001 factual traffic-light package, isolated test only */
.pc2-intro,.pc2-note,.pc2-muted,.pc2-footer { font-size:12px;line-height:1.6;color:#62605C;margin:8px 0 14px }
.pc2-note,.pc2-muted { color:#84817C }
.pc2-title { font-size:15px;margin:18px 0 7px;font-weight:700 }
.pc2-overview { display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 }
.pc2-tile { display:flex;align-items:center;gap:8px;background:#f7f7f5;border:1px solid #C8C4BC;border-radius:6px;padding:9px 13px;font-size:12px }
.pc2-tile strong { font-size:17px }
.pc2-dot {flex-shrink:0;width:12px;height:12px;display:inline-block;border-radius:50%;border:1px solid #777}
.pc2-green {background:#2D6A4F;border-color:#2D6A4F}
.pc2-orange {background:#B8750A;border-color:#B8750A}
.pc2-grey {background:#9C9C9C;border-color:#777}
.pc2-stage { border:1px solid #C8C4BC;background:white;border-radius:6px;margin:8px 0;overflow:hidden }
.pc2-stage-heading {display:flex;align-items:center;gap:10px;cursor:pointer;padding:13px 14px;list-style:none}
.pc2-stage-heading::-webkit-details-marker{display:none}
.pc2-stage-heading:after{content:"+";font-size:16px;color:#84817C}
.pc2-stage[open] .pc2-stage-heading:after{content:"−"}
.pc2-number {color:#D11919;font-weight:700;min-width:20px}
.pc2-heading-text {font-size:13px;font-weight:600;flex:1}
.pc2-flags {margin-left:auto;font-size:11px}
.pc2-pill {border-radius:12px;padding:4px 8px;display:inline-block}
.pc2-pill-orange {background:#f6e9ce;color:#805209}
.pc2-pill-neutral {background:#efede8;color:#62605C}
.pc2-stage-body {padding:14px 16px;border-top:1px solid #eee;background:#fdfdfb}
.pc2-reported-label {font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#84817C;font-weight:700;margin:10px 0 4px}
.pc2-reported {font-size:12px;white-space:pre-wrap;line-height:1.65}
.pc2-system {display:flex;align-items:center;gap:9px;font-size:12px;margin:7px 0;flex-wrap:wrap}
.pc2-system-name {flex:1;min-width:130px}
.pc2-status {min-width:100px;text-align:right;color:#62605C;font-size:11px}
.pc2-software {display:block;width:100%;margin-left:22px;color:#84817C;font-size:11px}
.pc2-extra {margin:16px 0;padding:12px 14px;border:1px solid #C8C4BC;border-radius:6px;background:#fff}
.pc2-extra summary {font-weight:600;font-size:12px;cursor:pointer}
.pc2-loading,.pc2-error {padding:12px;color:#62605C}
@media(max-width:650px){.pc2-stage-heading{flex-wrap:wrap}.pc2-flags{margin-left:30px}.pc2-system-name{min-width:0}.pc2-overview{gap:6px}.pc2-tile{padding:7px}}
.pc2-context {background:#f7f7f5;border:1px solid #C8C4BC;border-radius:6px;padding:10px 14px;font-size:12px;margin:11px 0}.pc2-context p{margin:3px 0;white-space:pre-wrap}

.pc2-red{background:#D11919;border-color:#D11919}
.pc2-pill-red{background:#fbe8e6;color:#9d1919}
.pc2-function .pc2-heading-text{text-transform:lowercase}
.pc2-function .pc2-stage-body{padding:9px 16px}


/* Inventory: functions and systems collapsed by default, status visible in summaries. */
.inv-dept{border:1px solid var(--border);border-radius:5px;margin-bottom:10px;background:#fff;overflow:hidden}
.inv-dept-h{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;background:var(--light-bg);list-style:none;font-size:12px;font-weight:600;min-height:44px}
.inv-dept-h::-webkit-details-marker,.inv-sys::-webkit-details-marker{display:none}
.inv-dept-name,.inv-sys-name{flex:1;min-width:0}
.inv-dept-status{font-size:11px;color:var(--subtle);font-weight:500}
.inv-dept-body{padding:0 12px 12px}
.inv-dept-info{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 4px;border-bottom:1px solid var(--border);margin-bottom:4px}
.inv-caret{width:10px;height:10px;flex:none;border-right:1.5px solid #666;border-bottom:1.5px solid #666;transform:rotate(45deg);margin:0 5px 5px}
details[open] > summary .inv-caret{transform:rotate(225deg);margin:5px 5px 0}
.inv-row{display:block;padding:0;margin:0;border:none;border-bottom:1px solid #e9e6df}
.inv-sys{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:11px 6px;font-size:12px;font-weight:600;min-height:42px}
.inv-sys:hover,.inv-dept-h:hover{background:#f7f5f1}
.inv-sys:focus-visible,.inv-dept-h:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.inv-row-body{padding:10px 14px 15px;background:#fcfbf9;border-top:1px solid #eeebe6;display:grid;gap:10px}
.inv-status-badge{display:inline-block;font-size:10.5px;font-weight:600;white-space:normal;text-align:right;padding:3px 8px;border-radius:12px;background:#efefec;color:#65625d}
.inv-status-badge.documented{background:#e1eee5;color:#226641}
.inv-status-badge.undocumented{background:#f9ecd3;color:#8c5b04}
.inv-status-badge.unimplemented{background:#fbe7e5;color:#a32222}
.inv-status-badge.unsure{background:#ecebea;color:#5c5c5c}
.inv-status-badge.na,.inv-status-badge.empty{background:#eee;color:#696969}
.inv-guide{font-size:12px;color:var(--dark);line-height:1.55;max-width:820px}
.inv-guide p{margin:4px 0 10px}
.inv-guide-label{color:var(--subtle);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.inv-row-body .inv-stats,.inv-row-body .inv-sw{padding:0;margin:0}
.inv-row-body .inv-sw{display:block}
@media(max-width:650px){.inv-dept-h,.inv-sys{gap:6px;padding:11px 8px}.inv-status-badge,.inv-dept-status{font-size:10px}}

/* CCF stage headers show all non-zero statuses; keep them readable on narrow screens. */
.pc2-stage-heading .pc2-flags{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap}
.pc2-pill-green{background:#e1eee5;color:#226641}
.pc2-pill-grey{background:#ecebea;color:#5c5c5c}
.pc2-stage-heading .pc2-pill{font-size:10.5px;line-height:1.35;white-space:nowrap}
.inv-examples{margin:6px 0 8px;padding-left:22px;list-style:disc outside}
.inv-examples li{font-size:12px;line-height:1.6;padding:2px 0;margin:2px 0}
.inv-examples strong{font-weight:600}
@media(max-width:680px){
 .pc2-stage-heading .pc2-flags{width:100%;justify-content:flex-start;margin-left:30px}
 .pc2-stage-heading .pc2-heading-text{flex-basis:calc(100% - 70px)}
}


/* Source-A client-flow synthesis: factual statuses plus conditional risk examples. */
.pc2-across{border:1px solid #C8C4BC;border-radius:6px;margin:14px 0 18px;background:#f9f8f5;overflow:hidden}
.pc2-across-heading{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;list-style:none;font-size:12px;font-weight:600}
.pc2-across-heading::-webkit-details-marker{display:none}
.pc2-across-heading:after{content:"+";font-size:16px;color:#84817C}
.pc2-across[open] .pc2-across-heading:after{content:"−"}
.pc2-across .pc2-flags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pc2-across-body{padding:12px 14px 5px;border-top:1px solid #dedad3}
.pc2-across-body .pc2-stage{margin:6px 0}
.pc2-story{margin:20px 0;padding:18px 20px;border:1px solid #C8C4BC;background:#f9f8f5;border-radius:6px}
.pc2-story .pc2-title{margin:0 0 14px;font-size:16px}
.pc2-story-lead{font-weight:600;font-size:13px;line-height:1.6;margin:0 0 10px}
.pc2-story-fact,.pc2-story-reading,.pc2-story-risk{font-size:12px;line-height:1.65;margin:8px 0}
.pc2-story-risk{margin-bottom:13px}
.pc2-story-boundary{font-size:11px;line-height:1.6;color:#74706a;margin:10px 0}
.pc2-story-details{border-top:1px solid #dedad3;padding-top:10px;margin-top:12px}
.pc2-story-details-heading{font-size:12px;font-weight:600;cursor:pointer}
.pc2-story-list{padding-left:22px;margin:8px 0 12px}
.pc2-story-list li{margin:8px 0;line-height:1.6;font-size:12px}
.pc2-story-list strong{font-weight:600}
@media(max-width:680px){.pc2-across-heading{flex-wrap:wrap}.pc2-across .pc2-flags{justify-content:flex-start;width:100%}.pc2-story{padding:14px 12px}}


/* Unweighted CCF summary: counts describe documentation/implementation work. */
.pc2-work-totals{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px;margin:14px 0}
.pc2-work-total{border:1px solid #C8C4BC;background:#fff;border-radius:6px;padding:9px 11px;display:flex;align-items:center;gap:7px;font-size:11px}
.pc2-work-total strong{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pc2-story-definitions{margin:12px 0}
.pc2-story-subtitle{font-size:12px;font-weight:700;margin:10px 0 7px}

/* Responsive client engagement layout: use the available browser width. */
html,body {max-width:100%;width:100%}
body {overflow-x:hidden}
.app {display:flex;width:100%;max-width:100%;min-width:0}
.sidebar {flex:0 0 220px}
.main {flex:1 1 auto;min-width:0;width:100%;max-width:none;padding:clamp(14px,2.3vw,36px) clamp(14px,2.3vw,36px) 64px}
.main > *, .section, .sec-body, .sec-header, .doc-header, .band, .card, .card-body,
.inv-dept, .inv-row, .inv-dept-body, .inv-row-body, .pc2-stage, .pc2-story, .pc2-overview,
.pc2-across, .pc2-stage-body, .pc2-context, .grid2, .grid3 {min-width:0;max-width:100%}
.main p, .main li, .pc2-heading-text, .inv-sys-name, .inv-dept-name,
.pc2-system-name, .inv-guide {overflow-wrap:break-word}
.main textarea, .main input, .main select {min-width:0;max-width:100%}
.sec-header, .sec-left {min-width:0;flex-wrap:wrap}
.pc2-stage-heading .pc2-heading-text {min-width:0}
.pc2-stage-heading .pc2-flags {min-width:0;max-width:100%}
table.t {width:100%;max-width:100%;table-layout:auto}
table.t th,table.t td {overflow-wrap:anywhere}

<div class="app">
  <nav class="sidebar">

    <div class="nav-label">sections</div>

    <a class="nav-item" href="#section-3"><span class="sdot" id="dot3"></span>03 consultation outcomes</a>
    <a class="nav-item" href="#section-plan"><span class="sdot" id="dotp"></span>contract and mapping plan</a>
    <a class="nav-item" href="#section-4"><span class="sdot" id="dot4"></span>04 system library</a>

<div class="msg" id="msg"></div>
<script>
'use strict';
/* OPS-001 v2.1: factual, read-only S1+S2 documentation traffic lights.
   No journey confirmation, automatic required-systems judgement or LLM. */
(function (root) {
  function el(tag, cls, value) {
    var x = document.createElement(tag);
    if (cls) x.className = cls;
    if (value != null) x.textContent = String(value);
    return x;
  }
  function add(parent, tag, cls, value) {
    var x=el(tag,cls,value); parent.appendChild(x);return x;
  }
  function statusName(s) {
    if (s==='documented') return 'documented';
    if (s==='not documented') return 'not documented';
    if (s==='not sure') return 'not sure';
    if (s==='not yet implemented') return 'needed, not yet implemented';
    if (s==='not applicable') return 'does not apply';
    return s;
  }
  function statusClass(s) {
    return s==='documented'?'green':s==='not documented'?'orange':s==='not yet implemented'?'red':'grey';
  }
  function renderRows(host, rows) {
    rows.forEach(function (system) {
      var row=add(host,'div','pc2-system');
      add(row,'span','pc2-dot pc2-'+statusClass(system.status),'');
      add(row,'span','pc2-system-name',system.name);
      add(row,'span','pc2-status',statusName(system.status));
      if (system.software && system.software.length) {
        var readable=system.software.filter(function(x){return !/^__/.test(x);});
        if(readable.length) add(row,'span','pc2-software',readable.join(', '));
      }
    });
  }
  function render(opts) {
    var host=opts.mountPackage;
    if (!host) return;
    host.replaceChildren();
    add(host,'p','pc2-loading','loading saved documentation status…');
    Promise.resolve().then(opts.fetchPackage).then(function (result) {
      host.replaceChildren();
      if (!result || result.ok!==true || !result.package || !result.package.source_A) throw Error('package unavailable');
      var a=result.package.source_A;
      add(host,'p','pc2-intro','this view uses your saved answers. green means documented, orange means done but not documented, red means you said this activity is needed but not yet implemented, and grey means not sure. this is a self-reported overview, not a verified readiness score.');
      var ctx=a.client_context||{};
      if(ctx.target||ctx.product){
        var context=add(host,'div','pc2-context');
        if(ctx.target)add(context,'p','','target customers: '+ctx.target);
        if(ctx.product)add(context,'p','','product or service: '+ctx.product);
      }
      var counts=a.inventory_counts||{};
      var allApplicable=['documented','not documented','not yet implemented','not sure'].reduce(function(n,k){return n+(Number(counts[k])||0);},0);
      add(host,'h3','pc2-title','all '+allApplicable+' systems across your business');
      add(host,'p','pc2-note','the status counts below cover systems you reported as applicable, including those marked not sure. activities marked not applicable are excluded.');
      var top=add(host,'div','pc2-overview');
      [['documented','green'],['not documented','orange'],['not yet implemented','red'],['not sure','grey']].forEach(function(row){
        var tile=add(top,'div','pc2-tile');
        add(tile,'span','pc2-dot pc2-'+row[1],'');
        add(tile,'strong','',counts[row[0]]||0);
        add(tile,'span','',row[0]+' systems');
      });
      var flow=a.ccf_flow||null;
      var acrossGroups=a.ccf_supporting_functions||[];
      var crossTotal=acrossGroups.reduce(function(n,fn){return n+(fn.items||[]).filter(function(x){return x.status!=='not applicable';}).length;},0);
      var stageTotal=(a.stage_coverage||[]).reduce(function(n,stage){return n+(stage.items||[]).filter(function(x){return x.status!=='not applicable';}).length;},0);
      var ccfTotal=flow ? flow.process_count : stageTotal+crossTotal;
      add(host,'h3','pc2-title','critical client flow');
      add(host,'p','pc2-note',ccfTotal+' applicable systems support your client flow. each is counted once: '+stageTotal+' support one stage and '+crossTotal+' support multiple stages. the associations come from the current reference map and still require review; statuses are your saved answers.');
      var narrative=add(host,'section','pc2-story');
      var hierarchy=add(host,'div','pc2-hierarchy');
      var single=add(hierarchy,'details','ccf-group');
      var singleHeader=add(single,'summary','');
      add(singleHeader,'span','ccf-group-name','systems supporting one stage');
      add(singleHeader,'span','ccf-group-count',stageTotal+' applicable');
      var singleFlags=add(singleHeader,'span','pc2-flags');
      [['documented','green','documented'],['not documented','orange','undocumented'],
       ['not yet implemented','red','needed, not started'],['not sure','grey','not sure']].forEach(function(item){
        var num=(a.stage_coverage||[]).reduce(function(n,stage){return n+(stage.items||[]).filter(function(x){return x.status===item[0];}).length;},0);
        if(num)add(singleFlags,'span','pc2-pill pc2-pill-'+item[1],num+' '+item[2]);
      });
      var singleBody=add(single,'div','ccf-group-body');
      (a.stage_coverage||[]).forEach(function(stage,index){
        var box=add(singleBody,'details','pc2-stage');
        var summary=add(box,'summary','pc2-stage-heading');
        add(summary,'span','pc2-number',String(index+1));
        add(summary,'span','pc2-heading-text',stage.question);
        var flags=add(summary,'span','pc2-flags');
        // Report every non-zero, client-reported status at this stage.
        // A documented system must not disappear because another is undocumented.
        var stageCounts=[
          {number:stage.documented||0,cls:'green',label:'documented'},
          {number:stage.undocumented||0,cls:'orange',label:'undocumented'},
          {number:stage.needed_not_implemented||0,cls:'red',label:'needed, not started'},
          {number:stage.uncertain||0,cls:'grey',label:'not sure'}
        ];
        stageCounts.forEach(function(item){
          if(item.number>0)add(flags,'span','pc2-pill pc2-pill-'+item.cls,item.number+' '+item.label);
        });
        if(!stageCounts.some(function(item){return item.number>0;})) {
          add(flags,'span','pc2-pill pc2-pill-neutral',stage.items.length ? 'status unavailable' : 'no associated systems');
        }
        var body=add(box,'div','pc2-stage-body');
        add(body,'div','pc2-reported-label','what you told us');
        add(body,'p','pc2-reported',stage.free_text||'no description provided for this stage.');
        if(stage.items.length){
          add(body,'div','pc2-reported-label','possible related systems from your inventory');
          renderRows(body,stage.items);
        }else{
          add(body,'p','pc2-muted','no active system in the catalogue is associated with this stage. this is not evidence of a missing system.');
        }
      });
      // This is one connected critical client flow. Some systems serve several
      // stages; keep them inside this journey rather than as a different section.
      function countSystems(groups,status) {
        return (groups||[]).reduce(function(n,g) {
          return n+(g.items||[]).filter(function(x){return x.status===status;}).length;
        },0);
      }
      function renderFunctionGroups(parent,groups) {
        (groups||[]).forEach(function(fn){
          if(!fn.items || !fn.items.some(function(x){return x.status!=='not applicable';})) return;
          var box=add(parent,'details','pc2-stage pc2-function');
          var summary=add(box,'summary','pc2-stage-heading');
          add(summary,'span','pc2-heading-text',fn.title);
          var badges=add(summary,'span','pc2-flags');
          var options=[
            ['documented','green','documented'],
            ['undocumented','orange','undocumented'],
            ['needed_not_implemented','red','needed, not started'],
            ['uncertain','grey','not sure']
          ];
          options.forEach(function(item){
            if(fn[item[0]])add(badges,'span','pc2-pill pc2-pill-'+item[1],fn[item[0]]+' '+item[2]);
          });
          var detail=add(box,'div','pc2-stage-body');
          renderRows(detail,fn.items.filter(function(item){return item.status!=='not applicable';}));
        });
      }
      if(crossTotal){
        var across=add(hierarchy,'details','ccf-group');
        var acrossSummary=add(across,'summary','');
        add(acrossSummary,'span','ccf-group-name','systems supporting multiple stages');
        add(acrossSummary,'span','ccf-group-count',crossTotal+' applicable');
        var acrossFlags=add(acrossSummary,'span','pc2-flags');
        [
          ['documented','green','documented'],
          ['not documented','orange','undocumented'],
          ['not yet implemented','red','needed, not started'],
          ['not sure','grey','not sure']
        ].forEach(function(option){
          var n=countSystems(acrossGroups,option[0]);
          if(n)add(acrossFlags,'span','pc2-pill pc2-pill-'+option[1],n+' '+option[2]);
        });
        var acrossBody=add(across,'div','ccf-group-body');
        add(acrossBody,'p','pc2-note','these processes are part of your critical client flow and are included in its total counts. they appear here because they support more than one step, rather than belonging to only one.');
        renderFunctionGroups(acrossBody,acrossGroups);
      }
      // One connected SYSTEMology client flow: there is no per-system or
      // per-stage importance weighting. Status counts indicate the work
      // reported by the prospect, not risk severity or later pricing.
      var stages=a.stage_coverage||[];
      add(narrative,'div','pc2-reported-label','critical client flow');
      if(!flow){
        add(narrative,'h3','pc2-title','flow diagnosis unavailable');
        add(narrative,'p','pc2-story-boundary','this report needs the updated CED-003 workflow to classify the complete client flow. the system statuses above remain available.');
      } else {
        if(flow.status==='exposed'){
          add(narrative,'h3','pc2-title','your critical client flow is exposed');
          add(narrative,'p','pc2-story-lead',
            'you have identified '+flow.work_count+' '+(flow.work_count===1?'process':'processes')+' in your client flow that still '+(flow.work_count===1?'needs':'need')+' attention: '+flow.undocumented_count+' '+(flow.undocumented_count===1?'needs':'need')+' documenting and '+flow.needed_not_implemented_count+' '+(flow.needed_not_implemented_count===1?'needs':'need')+' to be put in place.');
          add(narrative,'p','pc2-story-reading',
            'your client flow only works reliably when every step connects to the next. one missed step can cost you the sale, delay the money or stop a customer coming back. when markets get rough, your business has less room to absorb those losses. documenting the other steps does not remove that exposure.');
        } else if(flow.status==='unverified'){
          add(narrative,'h3','pc2-title','documentation of your critical client flow is unverified');
          add(narrative,'p','pc2-story-reading',
            'your saved information does not identify an undocumented or not-started process within the applicable client-flow systems, but some statuses or stage associations remain unresolved. the documentation of the full flow cannot yet be established.');
        } else {
          add(narrative,'h3','pc2-title','your identified client-flow processes are documented as reported');
          add(narrative,'p','pc2-story-reading',
            'all applicable client-flow processes identified in your inventory are reported documented. this does not verify actual execution, handoffs or that every necessary process has been captured.');
        }
        var totals=add(narrative,'div','pc2-work-totals');
        [
          {num:flow.documented_count,label:'documented',cls:'green'},
          {num:flow.undocumented_count,label:'to document',cls:'orange'},
          {num:flow.needed_not_implemented_count,label:'to establish',cls:'red'},
          {num:flow.uncertain_count,label:'to clarify',cls:'grey'}
        ].forEach(function(item){
          var tile=add(totals,'div','pc2-work-total');
          add(tile,'span','pc2-dot pc2-'+item.cls,'');
          add(tile,'strong','',item.num||0);
          add(tile,'span','',item.label);
        });
        if(flow.status==='exposed') {
          add(narrative,'p','pc2-story-fact',
            'this assessment counts all '+flow.process_count+' applicable processes in your critical client flow. '+
            flow.work_count+' '+(flow.work_count===1?'process needs':'processes need')+
            ' work, wherever '+(flow.work_count===1?'it sits':'they sit')+' in the flow.');
          add(narrative,'p','pc2-story-boundary',
            'the counts show how much work you identified across the flow. every process in your client flow matters.');
          var meaning=add(narrative,'div','pc2-story-definitions');
          add(meaning,'h4','pc2-story-subtitle','why these gaps put your business at risk');
          if(flow.undocumented_count){
            add(meaning,'p','pc2-story-risk',
              'undocumented: the work is happening, but there are no documented steps for someone else to follow. when the person who knows the routine is busy, away or leaves, customers may not get the same result.');
          }
          if(flow.needed_not_implemented_count){
            add(meaning,'p','pc2-story-risk',
              'needed, not started: you have identified work your business needs, but the process is not in place. depending on the activity, that can mean missed enquiries, delayed payments, problems delivering orders or fewer customers coming back.');
          }
          // Fixed, business-outcome-led stage examples; each scenario is a risk,
          // never a claim that a sale, customer or payment has already been lost.
          var stageScenarios={

function ccfName(s) { return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }

    const sid=String(stage.stage||'s'+(index+1));
    (stage.items||[]).forEach(item => {
      const name=ccfName(item.name||item.label||item.system_name);

      if (!byName[name]) byName[name]={type:'stage',stage:sid};

// shared factual pre-consultation report; no client-side journey checklist.
async function fetchPreconsultPackage() {
  const form = new URLSearchParams();
  form.set('session_token',token()); form.set('slug',SLUG);
  const r = await fetch(PRECONSULT_URL,{method:'POST',body:form,credentials:'omit'});
  if (!r.ok) throw Error('report access failed');
  const result = await r.json();
  if (!result || result.ok!==true) throw Error('report unavailable');
  return result;
}
function cachedPreconsultPackage() {
  if (PRECONSULT_CACHE) return Promise.resolve(PRECONSULT_CACHE);
  if (PRECONSULT_PENDING) return PRECONSULT_PENDING;
  const generation = PRECONSULT_GENERATION;
  PRECONSULT_PENDING = fetchPreconsultPackage().then(result => {
    if (generation!==PRECONSULT_GENERATION || !D || !token()) throw Error('superseded session report');
    PRECONSULT_CACHE = result;
    CCF_PRESENTATION_MAP = ccfBuildPresentationMap(result.package.source_A);
    PRECONSULT_PENDING = null;
    return result;
  }).catch(error => { PRECONSULT_PENDING = null; throw error; });
  return PRECONSULT_PENDING;
}

  return {mountPackage:document.getElementById('preconsult-package'),

function bindValue(path, value) {

  if (root === 's1' || root === 's2' || root === 's3') {

    if (root === 's2') { base.inventory = base.inventory || {}; base.owners = base.owners || {};
      if (rest[0] === 'owners') { const dk = rest[1], f = rest[2]; const ow = base.owners[dk] = base.owners[dk] || {};
        // a name and a role per area (the old "nobody assigned yet" option was removed on 2026-11-18)
        ow[f] = value; delete ow.none; }
      else { const field = rest[rest.length - 1]; const name = rest.slice(1, -1).join('.'); base.inventory[name] = base.inventory[name] || {}; base.inventory[name][field] = value; } }
    else if (root === 's3' && rest[0] === 'systems') { base.systems = Array.isArray(base.systems) ? base.systems : []; const row = base.systems[+rest[1]]; if (row) { const f = rest[2]; if (f === 'software') { const v = String(value).trim(); row.software = v.toLowerCase() === 'none' ? 'none' : v.split(',').map(x => x.trim()).filter(Boolean); } else row[f] = value; } }
    else base[rest[0]] = value;
    EDIT[key] = base; return;
  }
  if (root === 'sys') {
    const sys = rest[0], i = +rest[1], f = rest[2], sub = rest[3];
    const key = 'sys:' + sys; const s = sec('4', sys);
    const doc = EDIT[key] || JSON.parse(JSON.stringify((s && s.content) || { steps: [] }));
    const st = doc.steps[i]; if (!st) return;
    st.fields = st.fields || {};
    if (f === 'decision_logic') st.decision_logic = value || null;
    else if (f === 'sends_message') st.sends_message = !!value;
    else { st.fields[f] = st.fields[f] || { value: '', accepted: false };
      if (sub === 'accepted') st.fields[f].accepted = !!value;
      else { const lines = String(value).split('\n').map(x => x.trim()).filter(Boolean); st.fields[f].value = (f === 'routing' && lines.length > 1) ? lines : String(value); } }
    EDIT[key] = doc;
  }
}

function s2buf() { if (!EDIT.s2) EDIT.s2 = JSON.parse(JSON.stringify((sec('2') || {}).content || {})); EDIT.s2.inventory = EDIT.s2.inventory || {}; EDIT.s2.owners = EDIT.s2.owners || {}; EDIT.s2.coverage = EDIT.s2.coverage || {}; return EDIT.s2; }
function invRemove(k) { const b = s2buf(); const f = b.inventory[k] && b.inventory[k].func; delete b.inventory[k]; invalidateReview(f); render(); }
function invSetStatus(k, v) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const now = (b.inventory[k].status === v ? '' : v); b.inventory[k].status = now; if (now) b.inventory[k].unresolved = false; render(); }
function invSetUnresolved(k) { const b = s2buf(); b.inventory[k] = b.inventory[k] || {}; const on = !b.inventory[k].unresolved; b.inventory[k].unresolved = on; if (on) b.inventory[k].status = ''; render(); }
// software selection with combination rules (correction 3):
//  - "no software used" (__none__): exclusive with named tools / "other" / "not sure"; COMPATIBLE with paper + outside provider
//  - "paper" (__paper__) and "outside provider" (__outsourced__): combine with named tools, each other, and "no software used"
//      (a mixed internal/outsourced arrangement = a named tool AND "outside provider" together)
//  - "not sure" (__unsure_tools__): exclusive, chosen alone
//  - a named tool: clears "no software used" / "not sure" / the legacy token
//  - the legacy 'no software / paper-based' token is preserved verbatim and only removed when the client changes something (E2)
function invToggleSwToken(k, tok, on) {
  const b = s2buf(); b.inventory[k] = b.inventory[k] || {};
  let arr = Array.isArray(b.inventory[k].software) ? b.inventory[k].software.slice() : [];
  if (on) {
    if (tok === '__unsure_tools__') { arr = ['__unsure_tools__']; b.inventory[k].other = ''; }
    else if (tok === '__none__') { arr = arr.filter(x => x === '__paper__' || x === '__outsourced__'); arr.push('__none__'); b.inventory[k].other = ''; }
    else if (tok === 'no software / paper-based') { /* legacy is shown already-checked; turning it on is a no-op */ }
    else if (tok === '__paper__' || tok === '__outsourced__') {
      arr = arr.filter(x => x !== '__unsure_tools__' && x !== 'no software / paper-based');
      if (!arr.includes(tok)) arr.push(tok);
    } else { // a named tool
      arr = arr.filter(x => x !== '__none__' && x !== '__unsure_tools__' && x !== 'no software / paper-based');
      if (!arr.includes(tok)) arr.push(tok);
    }
  } else {
    arr = arr.filter(x => x !== tok);
  }
  b.inventory[k].software = arr; render();
}
document.addEventListener('change', e => { const el = e.target, a = el.getAttribute && el.getAttribute('data-act'); if (a === 'sw-token') invToggleSwToken(el.getAttribute('data-k'), el.getAttribute('data-sw'), el.checked); else if (a === 'func-review') setReviewed(el.getAttribute('data-k'), el.checked); else if (a === 'coverage-all') setAllReviewed(el.checked); });

// Verify the specific activity was corrected. For an inconsistency, a software
// change does not qualify: the client must correct its mistaken not-done status.
function isSavedFix(fx, savedInv) {
  if (!fx || !fx.sys || !fx.before) return false;
  const after = (savedInv && savedInv[fx.sys]) || {};
  if (fx.findingType === 'inconsistency') {
    const before = JSON.parse(fx.before);
    return ['not applicable', 'not yet implemented'].includes(before.status)
      && ['documented', 'not documented'].includes(after.status);
  }
  return JSON.stringify(after) !== fx.before;
}
// Resolve after successful save and before load() marks the assessment stale.
// Retain a retryable action if the resolution request itself fails.
async function resolveSavedFixesAfterSave(savedInv) {
  let failures = 0;
  for (const id of Object.keys(FIX)) {
    const fx = FIX[id];
    if (!fx || !['armed', 'ready'].includes(fx.state) || !isSavedFix(fx, savedInv)) continue;
    try {
      const r = await call2('finding_resolve', { finding_id: id, action: 'applied' });
      if (r && r.body && r.body.ok) delete FIX[id];
      else { fx.state = 'ready'; failures++; }
    } catch (e) { fx.state = 'ready'; failures++; }
  }
  return failures;
}
async function saveSection(n, sys) {
  const key = sys ? 'sys:' + sys : 's' + n; const s = sec(String(n), sys);
  const content = EDIT[key] || (s && s.content) || {};
  if (n === 2 && content.inventory) s2Stamp(content, { name: (D.me && D.me.name) || '', email: meEmail(), at: new Date().toISOString() });
  const r = await call('save_section', { section: String(n), system_id: sys || '', content, base_version: s ? s.version : 0 });
  if (r.body.ok) {
    delete EDIT[key];
    const failed = n === 2 ? await resolveSavedFixesAfterSave(content.inventory || {}) : 0;
    await load();
    toast(failed ? 'saved, but could not mark the finding fixed. please try again.' : 'saved, version ' + r.body.version, failed > 0);
    return true;
  }
  toast(r.body.error === 'conflict' ? 'someone saved a newer version. reload to see it.' : (r.body.error || 'not saved'), true);
  return false;
}

// Clicking a native summary updates only display state; the form data is untouched.

  details.open = next;
});
